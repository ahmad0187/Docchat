<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocChat: answers from your documents, with the page to prove it</title>
<meta name="description" content="Upload your PDFs and ask questions. Every answer cites the document and page. If it's not in your documents, DocChat says so.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#18191d; --muted:#6a6c73; --line:#e4e2db; --soft:#efede7;
  --accent:#0e6b5c; --accent-ink:#ffffff; --accent-soft:#e3f1ed; --cite:#b4540c; --cite-soft:#fbeedf;
  --danger:#b42318; --shadow:0 1px 2px rgba(20,20,20,.05),0 6px 24px rgba(20,20,20,.06);
  --r:14px; --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111214; --panel:#1a1b1f; --ink:#ecebe7; --muted:#9a9ba2; --line:#2b2c31; --soft:#222328;
  --accent:#3fb8a0; --accent-ink:#06211c; --accent-soft:#163029; --cite:#f0a35c; --cite-soft:#33261a; --danger:#f97066;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-left:12px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:9px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.who{font-size:13px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* layout */
main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 59px);height:calc(100dvh - 59px)}
aside{border-right:1px solid var(--line);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drop{display:block;cursor:pointer;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;background:var(--panel);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:6px 0 12px;color:var(--muted);font-size:13px}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.doc svg{flex:none;margin-top:2px;color:var(--cite)}
.doc .meta{flex:1;min-width:0}
.doc .name{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .sub{font-size:12.5px;color:var(--muted)}
.doc .sub.err{color:var(--danger)}
.doc .x{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:6px;font-size:16px;line-height:1}
.doc .x:hover{color:var(--danger);background:var(--soft)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px}
.note b{color:var(--ink)}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0}
.thread{flex:1;overflow:auto;padding:28px 22px 12px}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.empty{text-align:center;padding:6vh 0 0}
.empty h1{font:600 34px/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 auto 22px;max-width:520px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:13.5px}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
.q{align-self:flex-end;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:80%;white-space:pre-wrap}
.a{background:var(--panel);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:16px 18px;box-shadow:var(--shadow)}
.a .text{font-size:15.5px}
.a .text p{margin:0 0 8px}.a .text p:last-child{margin:0}
.a .text ul{margin:4px 0 8px;padding-left:20px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border:0;border-radius:6px;background:var(--cite-soft);color:var(--cite);font-size:11.5px;font-weight:700;vertical-align:2px}
.cite:hover{background:var(--cite);color:var(--panel)}
.idk{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.sources{margin-top:14px;display:grid;gap:8px}
.src{display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;transition:.15s}
.src:hover,.src.flash{border-color:var(--cite);background:var(--cite-soft)}
.src .n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--cite-soft);color:var(--cite);font-size:12px;font-weight:700;display:grid;place-items:center}
.src .t{font-size:13.5px;font-weight:600}
.src .t span{font-weight:500;color:var(--muted)}
.src .s{font-size:12.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
.err{color:var(--danger)}
.typing{display:flex;gap:5px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:1}}
form.ask{padding:12px 22px 20px}
form.ask .box{max-width:760px;margin:0 auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
form.ask .box:focus-within{border-color:var(--accent)}
form.ask input{flex:1;border:0;background:transparent;outline:0;min-width:0;padding:8px 0}
form.ask .btn{border-radius:11px}
.hint{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--muted);text-align:center}

/* dialog */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--ink);width:min(400px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,12,.45)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:12px}
dialog h2{margin:0;font:600 24px var(--serif)}
dialog p{margin:0;color:var(--muted);font-size:14px}
dialog input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
dialog input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:14px}
.msg{font-size:13.5px;min-height:1em}

@media (max-width:860px){
  header{padding:12px 16px;flex-wrap:wrap}
  .seg{margin-left:0;order:3;width:100%}.seg button{flex:1}
  main{grid-template-columns:1fr;height:auto;min-height:calc(100dvh - 104px)}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .docs{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .doc{min-width:210px;scroll-snap-align:start}
  .drop{padding:14px}.drop p{margin:4px 0 0}
  .note{font-size:12.5px;padding:10px 12px}
  .chat{min-height:70vh}
  .thread{padding:20px 16px 8px}
  form.ask{padding:10px 16px 16px;position:sticky;bottom:0;background:var(--bg)}
  .empty h1{font-size:28px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></div>
    DocChat
  </div>
  <div class="seg" role="group" aria-label="Workspace">
    <button id="tabDemo" aria-pressed="true">Demo library</button>
    <button id="tabMine" aria-pressed="false">My documents</button>
  </div>
  <div class="grow"></div>
  <span class="who" id="who"></span>
  <button class="btn" id="authBtn" hidden>Sign in</button>
</header>

<main>
  <aside>
    <div id="uploadWrap" hidden>
      <div class="label" style="margin-bottom:8px">Add documents</div>
      <label class="drop" id="drop">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <p>Drop a PDF here, or <u>browse</u><br><span id="limits"></span></p>
        <input type="file" id="file" accept="application/pdf,.pdf" class="sr">
      </label>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px" id="docsLabel">Documents</div>
      <ul class="docs" id="docs"></ul>
    </div>
    <div class="note" id="sideNote"></div>
  </aside>

  <section class="chat">
    <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
    <form class="ask" id="askForm" autocomplete="off">
      <div class="box">
        <label for="q" class="sr">Your question</label>
        <input id="q" maxlength="500" placeholder="Ask a question about these documents…">
        <button class="btn primary" id="send">Ask</button>
      </div>
      <div class="hint">Answers come only from the documents, with the page they came from. If it isn't there, DocChat says so.</div>
    </form>
  </section>
</main>

<dialog id="authDlg">
  <form method="dialog" id="authForm">
    <h2 id="authTitle">Sign in</h2>
    <p id="authSub">Your documents stay private to your account.</p>
    <input type="email" id="email" placeholder="Email" required autocomplete="email">
    <input type="password" id="password" placeholder="Password (8+ characters)" required minlength="8" autocomplete="current-password">
    <div class="msg" id="authMsg"></div>
    <div class="row">
      <button type="button" class="link" id="authSwitch">Create an account</button>
      <div class="grow"></div>
      <button type="button" class="btn" id="authCancel">Cancel</button>
      <button class="btn primary" id="authSubmit">Sign in</button>
    </div>
  </form>
</dialog>

<script src="/vendor/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
